name: Aggiorna redirect

on:
  schedule:
    - cron: "*/30 * * * *"   # ogni 30 minuti (GitHub puo' ritardare di qualche minuto)
  workflow_dispatch:          # permette di lanciarlo a mano dal tab Actions

permissions:
  contents: write

concurrency:
  group: aggiorna-redirect
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leggo il dominio e aggiorno la pagina
        run: python3 aggiorna.py

      - name: Salvo le modifiche (solo se ce ne sono)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html stato.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento automatico"
            git push
          fi
