name: Aggiorna redirect

on:
  schedule:
    - cron: "*/10 * * * *"   # ogni 10 minuti circa (GitHub puo' ritardare di qualche minuto)
  workflow_dispatch:          # lancio a mano dal tab Actions
    inputs:
      test:
        description: "Invia solo un'email di prova"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: aggiorna-redirect
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leggo il dominio da Telegram e aggiorno la pagina
        id: agg
        run: python3 aggiorna.py

      - name: Salvo le modifiche (solo se ce ne sono)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html stato.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento automatico"
            git push
          fi

      - name: Avviso per email (apro una segnalazione con la tua menzione)
        if: steps.agg.outputs.cambiato == 'true' || github.event.inputs.test == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          VECCHIO: ${{ steps.agg.outputs.vecchio }}
          NUOVO: ${{ steps.agg.outputs.nuovo }}
          TEST: ${{ github.event.inputs.test }}
        run: |
          if [ "$TEST" = "true" ]; then
            TITOLO="Prova avviso email"
            CORPO="Ciao @$OWNER, questa e' un'email di prova. Il dominio attuale e' $NUOVO. Se la leggi, gli avvisi funzionano."
          else
            TITOLO="Nuovo dominio: $NUOVO"
            CORPO="Ciao @$OWNER, il dominio e' cambiato: ${VECCHIO:-nessuno} -> $NUOVO. Fonte: canale Telegram Streaming community Sito Ufficiale. Il preferito si aggiorna da solo entro pochi minuti."
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITOLO" --body "$CORPO"
